name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Classify required gates
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "$base_sha" "$GITHUB_SHA" |
            node scripts/ci/plan-gates.mjs >> "$GITHUB_OUTPUT"
          git diff --check "$base_sha" "$GITHUB_SHA"
      - if: steps.scope.outputs.code == 'true'
        run: npm ci --ignore-scripts
      - if: steps.scope.outputs.code == 'true'
        run: npm run architecture
      - if: steps.scope.outputs.code == 'true'
        run: npm run lint
      - if: steps.scope.outputs.code == 'true'
        run: npm run typecheck
      - if: steps.scope.outputs.code == 'true'
        run: npm test
      - if: steps.scope.outputs.code == 'true'
        run: npm run build
      - name: Required Neon test-branch migration and integration gate
        if: steps.scope.outputs.provider == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_SESSION_002_TEST_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.NEON_SESSION_002_MIGRATION_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          REMOTE_TEST_DATABASE_RESET_ACK: ${{ vars.NEON_SESSION_002_TEST_DATABASE_NAME }}
          REMOTE_TEST_NEON_IDENTITY_ACK: ${{ vars.NEON_SESSION_002_RESET_IDENTITY_ACK }}
          NEON_PROJECT_ID: ${{ vars.NEON_SESSION_002_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_SESSION_002_BRANCH_ID }}
          NEON_BRANCH_NAME: ${{ vars.NEON_SESSION_002_BRANCH_NAME }}
          NEON_BRANCH_IS_DEFAULT: ${{ vars.NEON_SESSION_002_BRANCH_IS_DEFAULT }}
          NEON_ENDPOINT_ID: ${{ vars.NEON_SESSION_002_ENDPOINT_ID }}
          NEON_ENDPOINT_HOSTNAME: ${{ vars.NEON_SESSION_002_MIGRATION_ENDPOINT_HOSTNAME }}
          NEON_DATABASE_NAME: ${{ vars.NEON_SESSION_002_TEST_DATABASE_NAME }}
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$MIGRATION_DATABASE_URL"
          test -n "$NEON_API_KEY"
          test -n "$REMOTE_TEST_DATABASE_RESET_ACK"
          test -n "$REMOTE_TEST_NEON_IDENTITY_ACK"
          test -n "$NEON_PROJECT_ID"
          test -n "$NEON_BRANCH_ID"
          test -n "$NEON_BRANCH_NAME"
          test -n "$NEON_BRANCH_IS_DEFAULT"
          test -n "$NEON_ENDPOINT_ID"
          test -n "$NEON_ENDPOINT_HOSTNAME"
          test -n "$NEON_DATABASE_NAME"
          readonly expected_database="learning_hub_session_002_test"
          test "$REMOTE_TEST_DATABASE_RESET_ACK" = "$expected_database"
          test "$DATABASE_URL" != "$MIGRATION_DATABASE_URL"
          node --input-type=module <<'EOF'
          const expectedDatabase = "learning_hub_session_002_test";
          for (const value of [process.env.DATABASE_URL, process.env.MIGRATION_DATABASE_URL]) {
            try {
              if (new URL(value).pathname.slice(1) !== expectedDatabase) process.exit(1);
            } catch {
              process.exit(1);
            }
          }
          EOF
          npx tsx scripts/database/provider-preflight.ts
          npm run db:migrate
          npm run test:integration
          npm run test:identity-acceptance
      - name: Application HTTP smoke test
        if: steps.scope.outputs.code == 'true'
        shell: bash
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/learning-hub.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid; wait $server_pid || true' EXIT
          app_url=http://127.0.0.1:3000
          for attempt in {1..30}; do
            if curl --silent "$app_url/api/health/live" > /dev/null; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$app_url/")" = "200"
          test "$(curl --silent "$app_url/api/health/live")" = '{"status":"ok","service":"learning-hub"}'
      - name: Provider readiness HTTP smoke test
        if: steps.scope.outputs.provider == 'true'
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.NEON_SESSION_002_TEST_DATABASE_URL }}
          IDENTITY_EMAIL_WORKER_DATABASE_URL: ${{ secrets.NEON_SESSION_002_TEST_DATABASE_URL }}
          IDENTITY_MAINTENANCE_DATABASE_URL: ${{ secrets.NEON_SESSION_002_MIGRATION_DATABASE_URL }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
          AUTH_SECRET: ci-readiness-only-secret-value-000000
          AUTH_BASE_URL: http://127.0.0.1:3001/api/auth
          AUTH_EMAIL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          AUTH_EMAIL_KEY_VERSION: ci-v1
          AUTH_TERMS_VERSION: ci-terms
          AUTH_PRIVACY_VERSION: ci-privacy
          AUTH_EMAIL_FROM: identity-readiness@example.test
          RESEND_API_KEY: re_ci_readiness_only
          RESEND_WEBHOOK_SECRET: whsec_ci_readiness_only
          CRON_SECRET: cron_ci_readiness_only_000000000000
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3001 > /tmp/learning-hub-provider.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid; wait $server_pid || true' EXIT
          app_url=http://127.0.0.1:3001
          for attempt in {1..30}; do
            if curl --silent "$app_url/api/health/live" > /dev/null; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$app_url/api/health/ready")" = "200"
          test "$(curl --silent "$app_url/api/health/ready")" = '{"status":"ready","service":"learning-hub","dependencies":{"database":"ready","identityOperations":"ready"}}'
      - if: steps.scope.outputs.code == 'true'
        run: npm audit --omit=dev --audit-level=high
