name: Provider Preview Gate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_PROVIDER_PREVIEW after reviewing the PR
        required: true
        type: string
      pr_number:
        description: Reviewed pull request number
        required: true
        type: number
      reviewed_sha:
        description: Exact 40-character reviewed PR head SHA
        required: true
        type: string

permissions:
  contents: read
  deployments: read
  id-token: write
  pull-requests: read

concurrency:
  group: provider-preview-database
  cancel-in-progress: false

jobs:
  provider-preview:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'RUN_PROVIDER_PREVIEW'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the trusted gate from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Verify immutable SHA against the reviewed PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "$actual_sha" = "$REVIEWED_SHA"

      - name: Checkout reviewed candidate as inert data
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_sha }}
          path: candidate
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: trusted/package-lock.json

      - name: Install only trusted main dependencies without lifecycle scripts
        working-directory: trusted
        run: npm ci --ignore-scripts

      - name: Import only reviewed migration data
        shell: bash
        run: |
          test -d candidate/drizzle
          test -z "$(find candidate/drizzle -type l -print -quit)"
          test -z "$(find candidate/drizzle -type f ! \( -name '*.sql' -o -name '*.json' \) -print -quit)"
          rm -rf trusted/drizzle
          cp -R candidate/drizzle trusted/drizzle

      - name: Check reviewed migration metadata and safety with trusted tooling
        working-directory: trusted
        run: |
          npm run db:check
          npm run db:safety

      - name: Reset the isolated Neon Preview branch from Production
        id: reset-preview
        uses: neondatabase/reset-branch-action@470ab8101095ea33737c294d17364a72fd80761b # v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ vars.NEON_PREVIEW_BRANCH_ID }}
          parent: true
          cs_role_name: neondb_owner
          cs_database: neondb
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Apply reviewed SQL with trusted Drizzle tooling
        working-directory: trusted
        env:
          DATABASE_URL_UNPOOLED: ${{ steps.reset-preview.outputs.db_url }}
        run: npx drizzle-kit migrate

      - name: Verify migration journal with the Preview owner connection
        env:
          DATABASE_URL_UNPOOLED: ${{ steps.reset-preview.outputs.db_url }}
        run: psql "$DATABASE_URL_UNPOOLED" -v ON_ERROR_STOP=1 -c "select count(*) from drizzle.__drizzle_migrations;"

      - name: Seed Preview using trusted main code
        working-directory: trusted
        env:
          DATABASE_URL: ${{ steps.reset-preview.outputs.db_url }}
          CONFIRM_SEED: preview
        run: npx tsx db/seed.ts

      - name: Verify Preview runtime grants and Neon Auth with trusted code
        working-directory: trusted
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          NEON_AUTH_BASE_URL: ${{ vars.PREVIEW_NEON_AUTH_BASE_URL }}
        run: node scripts/provider-preview-smoke.mjs

      - name: Resolve the successful Vercel deployment for the reviewed SHA
        id: preview-deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        shell: bash
        run: |
          deployments="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${REVIEWED_SHA}&environment=Preview")"
          deployment_id="$(jq -r 'map(select(.creator.login == "vercel[bot]")) | first | .id // empty' <<< "$deployments")"
          deployment_sha="$(jq -r 'map(select(.creator.login == "vercel[bot]")) | first | .sha // empty' <<< "$deployments")"
          test -n "$deployment_id"
          test "$deployment_sha" = "$REVIEWED_SHA"
          preview_url="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            --jq 'map(select(.state == "success" and .creator.login == "vercel[bot]")) | first | .environment_url')"
          node -e 'const u=new URL(process.argv[1]); if(!/^ai-roem-dai-learning-[a-z0-9]+-ak3lab\.vercel\.app$/.test(u.hostname)) process.exit(1)' "$preview_url"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Mint a short-lived GitHub OIDC token for Vercel Trusted Sources
        id: vercel-oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Smoke the exact protected Vercel Preview deployment with trusted code
        working-directory: trusted
        env:
          PREVIEW_URL: ${{ steps.preview-deployment.outputs.preview_url }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel-oidc.outputs.token }}
        run: node scripts/deployed-preview-smoke.mjs
