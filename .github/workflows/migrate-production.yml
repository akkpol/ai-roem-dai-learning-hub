name: Prepare production migration diff

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PREPARE_PRODUCTION_DIFF
        required: true
        type: string
      approved_commit:
        description: Exact main commit SHA to prepare
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-diff
  cancel-in-progress: false

jobs:
  production-schema-diff:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PREPARE_PRODUCTION_DIFF' && inputs.approved_commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reset Preview from Production before constructing the candidate schema
        id: reset-preview
        uses: neondatabase/reset-branch-action@470ab8101095ea33737c294d17364a72fd80761b # v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ vars.NEON_PREVIEW_BRANCH_ID }}
          parent: true
          cs_role_name: neondb_owner
          cs_database: neondb
          api_key: ${{ secrets.NEON_API_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run db:check
      - run: npm run db:safety

      - name: Capture Production-equivalent schema before migration
        env:
          DATABASE_URL_UNPOOLED: ${{ steps.reset-preview.outputs.db_url }}
        run: pg_dump "$DATABASE_URL_UNPOOLED" --schema-only --no-owner --no-privileges > schema-before.sql

      - name: Apply approved migration to the freshly reset Preview branch
        env:
          DATABASE_URL_UNPOOLED: ${{ steps.reset-preview.outputs.db_url }}
        run: npx drizzle-kit migrate

      - name: Capture and diff the candidate Preview schema
        shell: bash
        env:
          DATABASE_URL_UNPOOLED: ${{ steps.reset-preview.outputs.db_url }}
        run: |
          pg_dump "$DATABASE_URL_UNPOOLED" --schema-only --no-owner --no-privileges > schema-after.sql
          diff -u schema-before.sql schema-after.sql > schema-diff.patch || test $? -eq 1
          test -s schema-after.sql

      - name: Candidate migration smoke test
        env:
          DATABASE_URL_UNPOOLED: ${{ steps.reset-preview.outputs.db_url }}
        run: psql "$DATABASE_URL_UNPOOLED" -v ON_ERROR_STOP=1 -c "select count(*) from drizzle.__drizzle_migrations;"

      - uses: actions/upload-artifact@v4
        with:
          name: schema-diff-${{ github.sha }}
          path: |
            schema-before.sql
            schema-after.sql
            schema-diff.patch
          retention-days: 30
