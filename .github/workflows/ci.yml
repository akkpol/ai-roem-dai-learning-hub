name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Classify required gates
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "$base_sha" "$GITHUB_SHA" |
            node scripts/ci/plan-gates.mjs >> "$GITHUB_OUTPUT"
          git diff --check "$base_sha" "$GITHUB_SHA"
      - if: steps.scope.outputs.code == 'true'
        run: npm ci --ignore-scripts
      - if: steps.scope.outputs.code == 'true'
        run: npm run architecture
      - if: steps.scope.outputs.code == 'true'
        run: npm run lint
      - if: steps.scope.outputs.code == 'true'
        run: npm run typecheck
      - if: steps.scope.outputs.code == 'true'
        run: npm test
      - if: steps.scope.outputs.code == 'true'
        run: npm run build
      - name: Required Neon test-branch migration and integration gate
        if: steps.scope.outputs.provider == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_SESSION_002_TEST_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.NEON_SESSION_002_MIGRATION_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          REMOTE_TEST_DATABASE_RESET_ACK: ${{ vars.NEON_SESSION_002_TEST_DATABASE_NAME }}
          REMOTE_TEST_NEON_IDENTITY_ACK: ${{ vars.NEON_SESSION_002_RESET_IDENTITY_ACK }}
          NEON_PROJECT_ID: ${{ vars.NEON_SESSION_002_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_SESSION_002_BRANCH_ID }}
          NEON_BRANCH_NAME: ${{ vars.NEON_SESSION_002_BRANCH_NAME }}
          NEON_BRANCH_IS_DEFAULT: ${{ vars.NEON_SESSION_002_BRANCH_IS_DEFAULT }}
          NEON_ENDPOINT_ID: ${{ vars.NEON_SESSION_002_ENDPOINT_ID }}
          NEON_ENDPOINT_HOSTNAME: ${{ vars.NEON_SESSION_002_MIGRATION_ENDPOINT_HOSTNAME }}
          NEON_DATABASE_NAME: ${{ vars.NEON_SESSION_002_TEST_DATABASE_NAME }}
          AUTH_SECRET: ci-identity-acceptance-secret-000000
          AUTH_BASE_URL: https://learning.example.test/api/auth
          AUTH_EMAIL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          AUTH_EMAIL_KEY_VERSION: ci-v1
          AUTH_EMAIL_FROM: identity-acceptance@example.test
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$MIGRATION_DATABASE_URL"
          test -n "$NEON_API_KEY"
          test -n "$REMOTE_TEST_DATABASE_RESET_ACK"
          test -n "$REMOTE_TEST_NEON_IDENTITY_ACK"
          test -n "$NEON_PROJECT_ID"
          test -n "$NEON_BRANCH_ID"
          test -n "$NEON_BRANCH_NAME"
          test -n "$NEON_BRANCH_IS_DEFAULT"
          test -n "$NEON_ENDPOINT_ID"
          test -n "$NEON_ENDPOINT_HOSTNAME"
          test -n "$NEON_DATABASE_NAME"
          readonly expected_database="learning_hub_session_002_test"
          test "$REMOTE_TEST_DATABASE_RESET_ACK" = "$expected_database"
          test "$DATABASE_URL" != "$MIGRATION_DATABASE_URL"
          node --input-type=module <<'EOF'
          const expectedDatabase = "learning_hub_session_002_test";
          for (const value of [process.env.DATABASE_URL, process.env.MIGRATION_DATABASE_URL]) {
            try {
              if (new URL(value).pathname.slice(1) !== expectedDatabase) process.exit(1);
            } catch {
              process.exit(1);
            }
          }
          EOF
          npx tsx scripts/database/provider-preflight.ts
          npm run db:migrate
          npm run test:integration
          npm run test:identity-acceptance
      - name: Provider authenticated organization browser gate
        if: steps.scope.outputs.provider == 'true'
        timeout-minutes: 8
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.NEON_SESSION_002_TEST_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.NEON_SESSION_002_MIGRATION_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          REMOTE_TEST_DATABASE_RESET_ACK: ${{ vars.NEON_SESSION_002_TEST_DATABASE_NAME }}
          REMOTE_TEST_NEON_IDENTITY_ACK: ${{ vars.NEON_SESSION_002_RESET_IDENTITY_ACK }}
          NEON_PROJECT_ID: ${{ vars.NEON_SESSION_002_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_SESSION_002_BRANCH_ID }}
          NEON_BRANCH_NAME: ${{ vars.NEON_SESSION_002_BRANCH_NAME }}
          NEON_BRANCH_IS_DEFAULT: ${{ vars.NEON_SESSION_002_BRANCH_IS_DEFAULT }}
          NEON_ENDPOINT_ID: ${{ vars.NEON_SESSION_002_ENDPOINT_ID }}
          NEON_ENDPOINT_HOSTNAME: ${{ vars.NEON_SESSION_002_MIGRATION_ENDPOINT_HOSTNAME }}
          NEON_DATABASE_NAME: ${{ vars.NEON_SESSION_002_TEST_DATABASE_NAME }}
          ORGANIZATION_E2E_FIXTURE_ACK: ${{ vars.NEON_SESSION_002_TEST_DATABASE_NAME }}
          NEXT_PUBLIC_APP_URL: http://localhost:3002
          AUTH_SECRET: ci-organization-e2e-secret-000000000
          AUTH_BASE_URL: http://localhost:3002/api/auth
          AUTH_EMAIL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          AUTH_EMAIL_KEY_VERSION: ci-v1
          AUTH_TERMS_VERSION: ci-terms
          AUTH_PRIVACY_VERSION: ci-privacy
          AUTH_EMAIL_FROM: organization-e2e@example.test
          RESEND_API_KEY: re_ci_organization_e2e
          IDENTITY_E2E_BASE_URL: http://localhost:3002
          ORGANIZATION_E2E_BASE_URL: http://localhost:3002
          ORGANIZATION_E2E_ALLOW_MUTATIONS: '1'
          ORGANIZATION_E2E_PROVIDER_GATE: '1'
        run: |
          fixture_dir="$RUNNER_TEMP/organization-e2e"
          mkdir -p "$fixture_dir"
          export E2E_FIXTURE_MANIFEST_PATH="$fixture_dir/manifest.json"
          export IDENTITY_E2E_ADMIN_STORAGE_STATE="$fixture_dir/owner-storage.json"
          export ORGANIZATION_E2E_SUCCESS_ARTIFACT_DIR="$fixture_dir/artifacts"
          export ORGANIZATION_E2E_DESKTOP_SLUG="e2e-desktop-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export ORGANIZATION_E2E_MOBILE_SLUG="e2e-mobile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          server_pid=""
          stop_server() {
            status=$?
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then kill "$server_pid"; fi
            if [ -n "$server_pid" ]; then wait "$server_pid" || true; fi
            exit "$status"
          }
          trap stop_server EXIT
          npx tsx scripts/database/provider-preflight.ts
          npm run start -- --hostname 127.0.0.1 --port 3002 > "$fixture_dir/server.log" 2>&1 &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --silent http://127.0.0.1:3002/api/health/live > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3002/api/health/live > /dev/null
          npx tsx scripts/e2e/organization-provider-fixture.ts prepare
          if ! find "$HOME/.cache/ms-playwright" -maxdepth 1 -type d -name 'chromium-*' | grep -q .; then npx playwright install chromium --with-deps; fi
          npx playwright test tests/e2e/organization-workspace.spec.ts --project=identity-admin-desktop --project=identity-admin-mobile --grep "real-stack organization journey" --workers=1
          printf '{"status":"passed","gate":"provider-organization-browser"}\n' > "$fixture_dir/artifacts/summary.json"
      - name: Cleanup provider organization browser fixture
        id: cleanup_provider_organization_fixture
        if: always() && steps.scope.outputs.provider == 'true'
        timeout-minutes: 5
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.NEON_SESSION_002_TEST_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.NEON_SESSION_002_MIGRATION_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          REMOTE_TEST_DATABASE_RESET_ACK: ${{ vars.NEON_SESSION_002_TEST_DATABASE_NAME }}
          REMOTE_TEST_NEON_IDENTITY_ACK: ${{ vars.NEON_SESSION_002_RESET_IDENTITY_ACK }}
          NEON_PROJECT_ID: ${{ vars.NEON_SESSION_002_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_SESSION_002_BRANCH_ID }}
          NEON_BRANCH_NAME: ${{ vars.NEON_SESSION_002_BRANCH_NAME }}
          NEON_BRANCH_IS_DEFAULT: ${{ vars.NEON_SESSION_002_BRANCH_IS_DEFAULT }}
          NEON_ENDPOINT_ID: ${{ vars.NEON_SESSION_002_ENDPOINT_ID }}
          NEON_ENDPOINT_HOSTNAME: ${{ vars.NEON_SESSION_002_MIGRATION_ENDPOINT_HOSTNAME }}
          NEON_DATABASE_NAME: ${{ vars.NEON_SESSION_002_TEST_DATABASE_NAME }}
          ORGANIZATION_E2E_FIXTURE_ACK: ${{ vars.NEON_SESSION_002_TEST_DATABASE_NAME }}
          E2E_FIXTURE_MANIFEST_PATH: ${{ runner.temp }}/organization-e2e/manifest.json
        run: npx tsx scripts/e2e/organization-provider-fixture.ts cleanup
      - name: Upload provider organization browser evidence
        if: always() && steps.scope.outputs.provider == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: provider-organization-browser-evidence
          path: |
            ${{ runner.temp }}/organization-e2e/artifacts/*.png
            ${{ runner.temp }}/organization-e2e/artifacts/summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload provider organization cleanup manifest
        if: always() && steps.cleanup_provider_organization_fixture.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: provider-organization-cleanup-authority
          path: ${{ runner.temp }}/organization-e2e/manifest.json
          if-no-files-found: warn
          retention-days: 1
      - name: Application HTTP smoke test
        if: steps.scope.outputs.code == 'true'
        shell: bash
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/learning-hub.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid; wait $server_pid || true' EXIT
          app_url=http://127.0.0.1:3000
          for attempt in {1..30}; do
            if curl --silent "$app_url/api/health/live" > /dev/null; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$app_url/")" = "200"
          test "$(curl --silent "$app_url/api/health/live")" = '{"status":"ok","service":"learning-hub"}'
      - name: Provider readiness HTTP smoke test
        if: steps.scope.outputs.provider == 'true'
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.NEON_SESSION_002_TEST_DATABASE_URL }}
          IDENTITY_EMAIL_WORKER_DATABASE_URL: ${{ secrets.NEON_SESSION_002_TEST_DATABASE_URL }}
          IDENTITY_MAINTENANCE_DATABASE_URL: ${{ secrets.NEON_SESSION_002_MIGRATION_DATABASE_URL }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
          AUTH_SECRET: ci-readiness-only-secret-value-000000
          AUTH_BASE_URL: http://127.0.0.1:3001/api/auth
          AUTH_EMAIL_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          AUTH_EMAIL_KEY_VERSION: ci-v1
          AUTH_TERMS_VERSION: ci-terms
          AUTH_PRIVACY_VERSION: ci-privacy
          AUTH_EMAIL_FROM: identity-readiness@example.test
          RESEND_API_KEY: re_ci_readiness_only
          RESEND_WEBHOOK_SECRET: whsec_ci_readiness_only
          CRON_SECRET: cron_ci_readiness_only_000000000000
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3001 > /tmp/learning-hub-provider.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid; wait $server_pid || true' EXIT
          app_url=http://127.0.0.1:3001
          for attempt in {1..30}; do
            if curl --silent "$app_url/api/health/live" > /dev/null; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$app_url/api/health/ready")" = "200"
          test "$(curl --silent "$app_url/api/health/ready")" = '{"status":"ready","service":"learning-hub","dependencies":{"database":"ready","identityOperations":"ready"}}'
      - if: steps.scope.outputs.code == 'true'
        run: npm audit --omit=dev --audit-level=high
