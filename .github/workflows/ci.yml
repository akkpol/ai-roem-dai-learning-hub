name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run architecture
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Required Neon test-branch migration and integration gate
        env:
          DATABASE_URL: ${{ secrets.NEON_SESSION_002_TEST_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.NEON_SESSION_002_MIGRATION_DATABASE_URL }}
          REMOTE_TEST_DATABASE_RESET_ACK: ${{ vars.NEON_SESSION_002_TEST_DATABASE_NAME }}
          REMOTE_TEST_NEON_IDENTITY_ACK: ${{ vars.NEON_SESSION_002_RESET_IDENTITY_ACK }}
          NEON_PROJECT_ID: ${{ vars.NEON_SESSION_002_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_SESSION_002_BRANCH_ID }}
          NEON_BRANCH_NAME: ${{ vars.NEON_SESSION_002_BRANCH_NAME }}
          NEON_BRANCH_IS_DEFAULT: ${{ vars.NEON_SESSION_002_BRANCH_IS_DEFAULT }}
          NEON_ENDPOINT_ID: ${{ vars.NEON_SESSION_002_ENDPOINT_ID }}
          NEON_ENDPOINT_HOSTNAME: ${{ vars.NEON_SESSION_002_MIGRATION_ENDPOINT_HOSTNAME }}
          NEON_DATABASE_NAME: ${{ vars.NEON_SESSION_002_TEST_DATABASE_NAME }}
          SESSION_002_APPROVED_NEON_BRANCH_ID: ${{ vars.NEON_SESSION_002_APPROVED_BRANCH_ID }}
          SESSION_002_APPROVED_NEON_BRANCH_NAME: ${{ vars.NEON_SESSION_002_APPROVED_BRANCH_NAME }}
          SESSION_002_APPROVED_NEON_ENDPOINT_ID: ${{ vars.NEON_SESSION_002_APPROVED_ENDPOINT_ID }}
          SESSION_002_APPROVED_NEON_ENDPOINT_HOSTNAME: ${{ vars.NEON_SESSION_002_APPROVED_ENDPOINT_HOSTNAME }}
          SESSION_002_APPROVED_NEON_DATABASE_NAME: ${{ vars.NEON_SESSION_002_APPROVED_DATABASE_NAME }}
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$MIGRATION_DATABASE_URL"
          test -n "$REMOTE_TEST_DATABASE_RESET_ACK"
          test -n "$REMOTE_TEST_NEON_IDENTITY_ACK"
          test -n "$NEON_PROJECT_ID"
          test -n "$NEON_BRANCH_ID"
          test -n "$NEON_BRANCH_NAME"
          test -n "$NEON_BRANCH_IS_DEFAULT"
          test -n "$NEON_ENDPOINT_ID"
          test -n "$NEON_ENDPOINT_HOSTNAME"
          test -n "$NEON_DATABASE_NAME"
          test -n "$SESSION_002_APPROVED_NEON_BRANCH_ID"
          test -n "$SESSION_002_APPROVED_NEON_BRANCH_NAME"
          test -n "$SESSION_002_APPROVED_NEON_ENDPOINT_ID"
          test -n "$SESSION_002_APPROVED_NEON_ENDPOINT_HOSTNAME"
          test -n "$SESSION_002_APPROVED_NEON_DATABASE_NAME"
          readonly expected_database="learning_hub_session_002_test"
          test "$REMOTE_TEST_DATABASE_RESET_ACK" = "$expected_database"
          test "$DATABASE_URL" != "$MIGRATION_DATABASE_URL"
          node --input-type=module <<'EOF'
          const expectedDatabase = "learning_hub_session_002_test";
          for (const value of [process.env.DATABASE_URL, process.env.MIGRATION_DATABASE_URL]) {
            try {
              if (new URL(value).pathname.slice(1) !== expectedDatabase) process.exit(1);
            } catch {
              process.exit(1);
            }
          }
          EOF
          npx tsx scripts/database/provider-preflight.ts
          npm run db:migrate
          npm run test:integration
      - name: Production HTTP smoke test
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.NEON_SESSION_002_TEST_DATABASE_URL }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/learning-hub.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          app_url=http://127.0.0.1:3000
          for attempt in {1..30}; do
            if curl --silent "$app_url/api/health/live" > /dev/null; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$app_url/")" = "200"
          test "$(curl --silent "$app_url/api/health/live")" = '{"status":"ok","service":"learning-hub"}'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$app_url/api/health/ready")" = "200"
          test "$(curl --silent "$app_url/api/health/ready")" = '{"status":"ready","service":"learning-hub","dependencies":{"database":"ready"}}'
      - run: npm audit --omit=dev --audit-level=high
