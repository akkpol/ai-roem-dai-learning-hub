name: Apply reviewed production migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_PRODUCTION_MIGRATION after reviewing the diff artifact
        required: true
        type: string
      approved_commit:
        description: Exact current main commit SHA
        required: true
        type: string
      approved_diff_run_id:
        description: Successful Prepare production migration diff workflow run ID reviewed by a human
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  apply-production:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'APPLY_PRODUCTION_MIGRATION' && inputs.approved_commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify and download the separately reviewed diff artifact
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          DIFF_RUN_ID: ${{ inputs.approved_diff_run_id }}
        shell: bash
        run: |
          [[ "$DIFF_RUN_ID" =~ ^[0-9]+$ ]]
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DIFF_RUN_ID}")"
          test "$(jq -r '.conclusion' <<< "$run_json")" = "success"
          test "$(jq -r '.head_sha' <<< "$run_json")" = "$APPROVED_COMMIT"
          test "$(jq -r '.path' <<< "$run_json")" = ".github/workflows/migrate-production.yml"

          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DIFF_RUN_ID}/jobs?filter=latest&per_page=100")"
          successful_diff_jobs="$(jq '[.jobs[] | select(.name == "production-schema-diff" and .status == "completed" and .conclusion == "success")] | length' <<< "$jobs_json")"
          test "$successful_diff_jobs" = "1"

          artifact_name="schema-diff-${APPROVED_COMMIT}"
          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${DIFF_RUN_ID}/artifacts?per_page=100")"
          artifact_id="$(jq -r \
            --arg name "$artifact_name" \
            --argjson run_id "$DIFF_RUN_ID" \
            '[.artifacts[] | select(.name == $name and .expired == false and .workflow_run.id == $run_id)] | if length == 1 then .[0].id else empty end' \
            <<< "$artifacts_json")"
          test -n "$artifact_id"

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > approved-schema-diff.zip
          expected_entries="$(printf '%s\n' schema-after.sql schema-before.sql schema-diff.patch | LC_ALL=C sort)"
          actual_entries="$(unzip -Z1 approved-schema-diff.zip | LC_ALL=C sort)"
          test "$actual_entries" = "$expected_entries"
          mkdir approved-schema-diff
          unzip -q approved-schema-diff.zip -d approved-schema-diff
          test -s approved-schema-diff/schema-before.sql
          test -s approved-schema-diff/schema-after.sql
          test -f approved-schema-diff/schema-diff.patch
          sha256sum approved-schema-diff/schema-before.sql approved-schema-diff/schema-after.sql approved-schema-diff/schema-diff.patch

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run db:check
      - run: npm run db:safety

      - name: Apply the migration approved in the separate diff run
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npx drizzle-kit migrate
